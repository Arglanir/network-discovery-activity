<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Chat / Messages</title>
    <!----------------------    Un peu de style    --------------------->
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .field {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #chat-box {
            border: 1px solid #ddd;
            border-radius: 4px;
            height: 300px;
            overflow-y: auto;
            padding: 10px;
            background-color: #f9f9f9;
        }
        .message-item {
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 1px dotted #eee;
        }
        .author {
            font-weight: bold;
            color: #0066cc;
        }
    </style>
</head>
<body>
    <!------------------------ Ce qu'on voit réellement ---------------------------->
    <h2>Messagerie en direct</h2>

    <div class="field">
        <label for="username">Nom :</label>
        <input type="text" id="username" placeholder="Votre nom..." value="Anonyme">
    </div>

    <div class="field">
        <label for="message">Message (Appuyez sur Entrée pour envoyer) :</label>
        <input type="text" id="message" placeholder="Écrivez votre message ici..." autocomplete="off">
    </div>

    <h3>Derniers messages (20 max) :</h3>
    <div id="chat-box"></div>

    <!------------------------ Et la partie intelligente pour agir ---------------------------->
    <script type="text/javascript">
        const messageInput = document.getElementById('message');
        const usernameInput = document.getElementById('username');
        const chatBox = document.getElementById('chat-box');

        // Récupérer les messages depuis l'API
        async function fetchMessages() {
            try {
                const response = await fetch('/messages');
                if (response.ok) {
                    const messages = await response.json();
                    renderMessages(messages);
                }
            } catch (err) {
                console.error('Erreur lors de la récupération des messages:', err);
            }
        }

        // Afficher les messages dans le DOM
        function renderMessages(messages) {
            chatBox.innerHTML = '';
            messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = 'message-item';
                
                const authorSpan = document.createElement('span');
                authorSpan.className = 'author';
                authorSpan.textContent = (msg.author || 'Anonyme') + ' : ';
                
                const textSpan = document.createElement('span');
                textSpan.textContent = msg.text;

                div.appendChild(authorSpan);
                div.appendChild(textSpan);
                chatBox.appendChild(div);
            });
            // Défiler vers le bas automatiquement
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Envoyer un message
        async function sendMessage() {
            const text = messageInput.value.trim();
            const author = usernameInput.value.trim() || 'Anonyme';

            if (!text) return;

            // Vider le champ de saisie immédiatement
            messageInput.value = '';

            try {
                await fetch('/message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ author, text })
                });
                // Actualise immédiatement les messages après l'envoi
                fetchMessages();
            } catch (err) {
                console.error('Erreur lors de l\'envoi du message:', err);
            }
        }

        // Écouteur pour la touche "Entrée"
        messageInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                sendMessage();
            }
        });

        // Charger les messages au démarrage et rafraîchir toutes les 5 secondes
        fetchMessages();
        setInterval(fetchMessages, 5000);
    </script>
</body>
</html>
